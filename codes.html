<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>สร้างรหัสบัตร — THE EX-CLUSIVE NIGHT</title>
<style>
  :root{--se-red:#C2272D;--ink:#111;--soft:#4A4A4A;--grey:#909195;--line:#E2E2E4;--bg:#F4F4F5;--ok:#0F9D58;
        --ui:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Segoe UI","Noto Sans Thai","Sarabun",Arial,sans-serif}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);font-family:var(--ui);color:var(--ink)}
  .wrap{max-width:1080px;margin:0 auto;padding:26px 20px 70px}

  .top{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:22px}
  .logo{display:inline-block;background:#fff;padding:4px 7px}
  .logo b{display:block;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;font-size:14px;
          font-weight:900;color:#000;letter-spacing:-.025em;line-height:1.06;white-space:nowrap;margin:2.5px 0}
  .logo i{display:block;height:2px;background:var(--se-red)}
  .top h1{margin:0;font-size:13px;letter-spacing:.22em;font-weight:800}
  .top h1 span{display:block;font-size:9.5px;letter-spacing:.14em;color:var(--grey);font-weight:400;margin-top:4px}

  .panel{background:#fff;border:1px solid var(--line);padding:20px;margin-bottom:14px}
  .panel h2{margin:0 0 4px;font-size:10px;letter-spacing:.2em;color:var(--grey)}
  .panel p.help{margin:0 0 14px;font-size:11.5px;color:var(--grey);line-height:1.75}
  textarea{width:100%;min-height:180px;font-family:var(--ui);font-size:14px;line-height:1.7;
           border:1px solid var(--line);padding:12px;outline:none;resize:vertical}
  textarea:focus{border-color:var(--se-red)}

  .opts{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end;margin-top:14px}
  .opt{display:flex;flex-direction:column;gap:6px}
  .opt label{font-size:9px;letter-spacing:.18em;color:var(--grey)}
  .opt input,.opt select{font-family:inherit;font-size:14px;padding:10px 11px;border:1px solid var(--line);
                         background:#fff;outline:none;min-width:120px}
  .opt input:focus,.opt select:focus{border-color:var(--se-red)}
  .chk{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--soft);cursor:pointer;padding-bottom:10px}
  .chk input{width:17px;height:17px;accent-color:var(--se-red)}

  .btn{border:0;padding:13px 22px;background:var(--se-red);color:#fff;font-family:inherit;
       font-size:11px;font-weight:700;letter-spacing:.16em;cursor:pointer}
  .btn:disabled{opacity:.5;cursor:default}
  .btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--ink)}
  .row{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px;align-items:center}
  .note{font-size:11.5px;color:var(--grey);line-height:1.7}
  .note.ok{color:var(--ok)}
  .note.bad{color:var(--se-red)}

  table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);font-size:13px}
  th{text-align:left;font-size:9px;letter-spacing:.16em;color:var(--grey);font-weight:600;
     padding:12px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
  td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
  tr:last-child td{border-bottom:0}
  td.no{color:var(--grey);font-size:11.5px;width:34px}
  td.code b{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13.5px;color:var(--se-red);letter-spacing:.06em}
  td.link{font-size:11px;color:var(--grey);word-break:break-all;max-width:300px}
  .mini{border:1px solid var(--line);background:#fff;font-family:inherit;font-size:9.5px;letter-spacing:.1em;
        padding:7px 11px;cursor:pointer;white-space:nowrap}
  .mini.done{border-color:var(--ok);color:var(--ok)}
  .qrcell{width:76px}
  .qrcell div{width:62px;height:62px;display:grid;place-items:center;cursor:pointer}
  .qrcell img,.qrcell canvas{width:62px !important;height:62px !important;display:block}
  .empty{background:#fff;border:1px solid var(--line);padding:44px 20px;text-align:center;
         color:var(--grey);font-size:13px;line-height:1.9}
  @media (max-width:820px){ .hidesm{display:none} }
</style>
</head>
<body>
<div class="wrap">

  <div class="top">
    <div class="logo"><i></i><b>STIEBEL ELTRON</b><i></i></div>
    <h1>CODE GENERATOR<span>THE EX-CLUSIVE NIGHT · 6 OCT 2026</span></h1>
  </div>

  <div class="panel">
    <h2>รายชื่อแขก</h2>
    <p class="help">
      พิมพ์หรือวางรายชื่อ <b>บรรทัดละหนึ่งคน</b> — ก๊อปจาก Excel มาวางได้เลย<br>
      ใส่บริษัทต่อท้ายได้ โดยคั่นด้วยแท็บหรือจุลภาค เช่น <code>สมชาย ใจดี, บจก. ตัวอย่าง</code>
    </p>
    <textarea id="names" placeholder="สมชาย ใจดี, บจก. ตัวอย่าง
สมหญิง รักดี, ร้านช่างน้ำอุ่น
Michael Chen, Stiebel Eltron Asia"></textarea>

    <div class="opts">
      <div class="opt"><label>คำนำหน้ารหัส</label><input id="prefix" value="EX-2026-"></div>
      <div class="opt"><label>ความยาวรหัสสุ่ม</label>
        <select id="len"><option value="4" selected>4 ตัว</option><option value="5">5 ตัว</option><option value="6">6 ตัว</option></select>
      </div>
      <label class="chk"><input type="checkbox" id="useQR" checked> สร้าง QR ให้ด้วย</label>
      <label class="chk"><input type="checkbox" id="checkDB" checked> เช็คไม่ให้ซ้ำกับที่มีในระบบ</label>
    </div>

    <div class="row">
      <button class="btn" id="gen">สร้างรหัสและลิงก์</button>
      <button class="btn ghost" id="regen" style="display:none">สุ่มรหัสใหม่ทั้งหมด</button>
      <span class="note" id="status"></span>
    </div>
  </div>

  <div class="row" id="exports" style="display:none;margin:0 0 14px">
    <button class="btn ghost" id="copyAll">คัดลอกทั้งตาราง (วางลง Excel ได้)</button>
    <button class="btn ghost" id="copyLinks">คัดลอกเฉพาะลิงก์</button>
    <button class="btn" id="csv">ดาวน์โหลด CSV</button>
  </div>

  <div id="out"><div class="empty">ยังไม่มีรายชื่อ<br>ใส่รายชื่อด้านบนแล้วกดปุ่มสร้างรหัส</div></div>
</div>

<script src="config.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
/* ตัวอักษรที่ใช้สุ่ม — ตัดตัวที่อ่านสับสนออก (0 O 1 I 2 Z 5 S 8 B) */
const ALPHA = "ACDEFGHJKLMNPQRTUVWXY34679";
const DB    = (window.EXN && window.EXN.db) || {url:"",path:"rsvps",auth:""};
const BASE  = new URL("index.html", location.href).href;

let list = [];

const rand = n => Array.from({length:n}, ()=> ALPHA[Math.floor(Math.random()*ALPHA.length)]).join("");
const esc  = s => String(s??"").replace(/[<>&"]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]));
const say  = (msg, cls="") => { status.className = "note "+cls; status.textContent = msg; };

function parseNames(){
  return names.value.split("\n").map(l=>l.trim()).filter(Boolean).map(line=>{
    const parts = line.split(/\t|,/).map(x=>x.trim());
    return {name: parts[0], company: parts[1] || ""};
  });
}

async function existingCodes(){
  if(!checkDB.checked || !DB.url) return new Set();
  try{
    const url = DB.url.replace(/\/$/,"") + "/" + DB.path + ".json" + (DB.auth ? "?auth="+DB.auth : "");
    const data = await (await fetch(url)).json() || {};
    return new Set(Object.values(data).map(r => (r.code||"").toUpperCase()));
  }catch(e){ return new Set(); }
}

async function generate(){
  const people = parseNames();
  if(!people.length) return say("ยังไม่ได้ใส่รายชื่อ","bad");

  gen.disabled = true; say("กำลังสร้าง…");
  const taken = await existingCodes();
  const n = Number(len.value), pre = prefix.value.trim();

  list = people.map(p=>{
    let code, guard = 0;
    do{ code = pre + rand(n); guard++; }while(taken.has(code.toUpperCase()) && guard < 500);
    taken.add(code.toUpperCase());
    return {...p, code, link: BASE + "?code=" + encodeURIComponent(code) +
                              (p.name ? "&name=" + encodeURIComponent(p.name) : "")};
  });

  draw();
  gen.disabled = false;
  regen.style.display = "inline-block";
  exports.style.display = "flex";
  say("สร้างครบ " + list.length + " รายชื่อ · รหัสไม่ซ้ำกันทั้งหมด" +
      (DB.url && checkDB.checked ? " และไม่ซ้ำกับที่มีในระบบ" : ""), "ok");
}

function draw(){
  out.innerHTML = `<table><thead><tr>
      <th></th><th>ชื่อ</th><th class="hidesm">บริษัท</th><th>รหัสบัตร</th>
      ${useQR.checked ? "<th>QR</th>" : ""}<th class="hidesm">ลิงก์</th><th></th></tr></thead>
    <tbody>${list.map((r,i)=>`<tr>
      <td class="no">${i+1}</td>
      <td><b>${esc(r.name)}</b></td>
      <td class="hidesm">${esc(r.company) || "–"}</td>
      <td class="code"><b>${esc(r.code)}</b></td>
      ${useQR.checked ? `<td class="qrcell"><div id="q${i}" title="กดเพื่อดาวน์โหลด"></div></td>` : ""}
      <td class="link hidesm">${esc(r.link)}</td>
      <td><button class="mini" data-i="${i}">คัดลอกลิงก์</button></td>
    </tr>`).join("")}</tbody></table>`;

  out.querySelectorAll(".mini").forEach(b=>{
    b.onclick = ()=>{
      navigator.clipboard.writeText(list[b.dataset.i].link);
      b.textContent = "คัดลอกแล้ว"; b.classList.add("done");
      setTimeout(()=>{ b.textContent = "คัดลอกลิงก์"; b.classList.remove("done"); }, 1600);
    };
  });

  if(useQR.checked && window.QRCode){
    list.forEach((r,i)=>{
      const box = document.getElementById("q"+i); if(!box) return;
      new QRCode(box, {text:r.link, width:124, height:124,
                       colorDark:"#111111", colorLight:"#ffffff", correctLevel:QRCode.CorrectLevel.M});
      box.onclick = ()=>{
        const src = box.querySelector("canvas") || box.querySelector("img");
        if(!src) return;
        const a = document.createElement("a");
        a.href = src.tagName === "CANVAS" ? src.toDataURL("image/png") : src.src;
        a.download = r.code + ".png"; a.click();
      };
    });
  }
}

gen.onclick   = generate;
regen.onclick = generate;

copyAll.onclick = ()=>{
  const t = "ชื่อ\tบริษัท\tรหัสบัตร\tลิงก์\n" +
            list.map(r=>[r.name,r.company,r.code,r.link].join("\t")).join("\n");
  navigator.clipboard.writeText(t); say("คัดลอกทั้งตารางแล้ว วางลง Excel หรือ Google Sheets ได้เลย","ok");
};
copyLinks.onclick = ()=>{
  navigator.clipboard.writeText(list.map(r=>r.link).join("\n"));
  say("คัดลอกลิงก์ทั้งหมดแล้ว","ok");
};
csv.onclick = ()=>{
  const head = ["ชื่อ","บริษัท","รหัสบัตร","ลิงก์"];
  const body = list.map(r=>[r.name,r.company,r.code,r.link]
                 .map(v=>`"${String(v).replace(/"/g,'""')}"`).join(","));
  const blob = new Blob(["\uFEFF"+head.join(",")+"\n"+body.join("\n")],{type:"text/csv;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "exclusive-night-codes-" + new Date().toISOString().slice(0,10) + ".csv";
  a.click();
};
useQR.onchange = ()=>{ if(list.length) draw(); };
</script>
</body>
</html>
