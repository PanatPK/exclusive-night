<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1">
<title>THE EX-CLUSIVE NIGHT — STIEBEL ELTRON</title>
<style>
  :root{
    --se-red:#BA0C2F; --ink:#111111; --ink-soft:#4A4A4A; --grey:#909195;
    --line:#D9D9D9; --paper:#FFFFFF; --shell:#EDEDED; --accent:#6E6E73;
    --font-display:"Times New Roman","Georgia",serif;
    --font-ui:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Segoe UI","Noto Sans Thai","Sarabun",Arial,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{margin:0;font-family:var(--font-ui);background:var(--shell);color:var(--ink);
       display:flex;align-items:center;justify-content:center;overflow:hidden}

  .stage{width:100%;height:100dvh;display:flex;align-items:center;justify-content:center;padding:20px}
  .phone{position:relative;width:100%;max-width:404px;height:min(870px,calc(100dvh - 40px));
         background:#0d0d0d;border-radius:46px;padding:11px;
         box-shadow:0 30px 70px rgba(0,0,0,.28),0 2px 6px rgba(0,0,0,.2)}
  .screen{position:relative;width:100%;height:100%;background:var(--paper);
          border-radius:36px;overflow:hidden;display:flex;flex-direction:column}
  @media (max-width:520px){
    .stage{padding:0}
    .phone{max-width:none;height:100dvh;border-radius:0;padding:0;box-shadow:none}
    .screen{border-radius:0}
  }

  /* ---------- LOGO ---------- */
  .brandbar{padding:24px 26px 0;text-align:center;flex:none}
  .logo{display:block;width:148px;height:auto;margin:0 auto}

  /* ---------- SOFTCUBE DIAL ---------- */
  .knobzone{flex:none;padding:18px 26px 0;display:flex;flex-direction:column;align-items:center}
  .cube{position:relative;width:min(234px,60vw);aspect-ratio:1;border-radius:27%;
        background:linear-gradient(165deg,#6d6d70 0%,#58585b 24%,#4c4c4f 58%,#414144 100%);
        box-shadow:0 24px 44px rgba(0,0,0,.30),0 4px 10px rgba(0,0,0,.18),
                   inset 0 2px 2px rgba(255,255,255,.18),inset 0 -16px 30px rgba(0,0,0,.26);
        touch-action:none;cursor:grab}
  .cube:active{cursor:grabbing}

  /* ขีดอ้างอิงสีขาวด้านบนตัวเครื่อง */
  .toptick{position:absolute;top:4.5%;left:50%;width:2.4%;height:7.5%;transform:translateX(-50%);
           border-radius:99px;background:rgba(255,255,255,.95);z-index:4;
           box-shadow:0 1px 2px rgba(0,0,0,.35)}

  .cube svg.ring{position:absolute;inset:0;width:100%;height:100%;overflow:visible;z-index:1}
  .track{fill:none;stroke:rgba(255,255,255,.9);stroke-width:2.4;stroke-linecap:round}
  .heat{fill:none;stroke:url(#heatgrad);stroke-width:4.6;stroke-linecap:round;
        stroke-dasharray:100;stroke-dashoffset:100;transition:stroke-dashoffset .05s linear;
        filter:drop-shadow(0 0 5px rgba(255,255,255,.2))}

  /* ลูกบิดอะลูมิเนียมปัดเสี้ยน */
  .knob{position:absolute;inset:19%;border-radius:50%;z-index:2;
    background:
      radial-gradient(circle at 50% 42%, rgba(255,255,255,.42) 0%, rgba(255,255,255,.06) 32%,
                                          rgba(0,0,0,.05) 60%, rgba(0,0,0,.30) 100%),
      conic-gradient(from 90deg,
        #a9acaf,#7d8083,#cacdd0,#8a8d90,#c0c3c6,#777a7d,#b5b8bb,#828589,#c7cacd,#8d9093,
        #a2a5a8,#757a7d,#c3c6c9,#878a8d,#bcbfc2,#7b7e81,#afb2b5,#7f8285,#c5c8cb,#898c8f,#a9acaf);
    box-shadow:0 10px 20px rgba(0,0,0,.42),0 2px 5px rgba(0,0,0,.32),
               inset 0 0 0 1px rgba(255,255,255,.32),inset 0 -12px 22px rgba(0,0,0,.28)}
  .mark{position:absolute;top:7.5%;left:50%;width:3.4%;height:13%;transform:translateX(-50%);
        border-radius:99px;background:#fff;z-index:3;transition:box-shadow .35s;
        box-shadow:0 1px 3px rgba(0,0,0,.4)}
  .mark.live{box-shadow:0 1px 3px rgba(0,0,0,.4),0 0 10px color-mix(in srgb,var(--accent) 85%,transparent)}

  .cube .ic{position:absolute;width:8.6%;height:8.6%;stroke:#fff;fill:none;stroke-width:2;
            stroke-linecap:round;opacity:.92;z-index:4}
  .cube .ic.pw{left:20%;top:73%}
  .cube .ic.th{right:20%;top:73%}

  .cubelogo{position:absolute;left:50%;bottom:6.5%;transform:translateX(-50%);z-index:4;width:47%}
  .cubelogo img{display:block;width:100%;height:auto}

  .hint{margin-top:14px;font-size:11px;letter-spacing:.16em;color:var(--grey);text-transform:uppercase;
        text-align:center;height:15px;transition:opacity .4s ease}
  .hint.gone{opacity:0}

  .dots{display:flex;gap:6px;justify-content:center;margin-top:10px;flex:none;padding:0 24px}
  .dot{width:100%;max-width:48px;height:26px;border:0;background:none;padding:0;cursor:pointer;
       display:flex;flex-direction:column;align-items:center;gap:5px}
  .dot i{display:block;width:100%;height:2px;background:var(--line);transition:background .3s}
  .dot em{font-style:normal;font-size:8px;letter-spacing:.08em;color:var(--line);transition:color .3s}
  .dot.on i{background:var(--accent)}
  .dot.on em{color:var(--ink)}
  .dot.past i{background:color-mix(in srgb,var(--accent) 45%,#fff)}

  .panel{flex:1;min-height:0;overflow-y:auto;padding:16px 30px 18px;-webkit-overflow-scrolling:touch}
  .card{animation:rise .45s cubic-bezier(.2,.7,.3,1) both}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

  /* OFF state */
  .off{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
  .off .stand{width:1px;height:26px;background:var(--line)}
  .off p{margin:0;font-size:11px;letter-spacing:.2em;color:#C4C4C6;text-align:center}
  .off p.th{font-size:12.5px;letter-spacing:.02em;color:var(--grey)}

  .eyebrow{font-size:9.5px;letter-spacing:.28em;color:var(--grey);text-align:center;margin-bottom:12px}
  .display{font-family:var(--font-display);text-align:center;line-height:.95;margin:0;letter-spacing:.02em}
  .display .pre{display:block;font-size:.34em;letter-spacing:.34em;color:var(--ink-soft);margin-bottom:8px;
                font-family:var(--font-ui);font-weight:600}
  .display .red{color:var(--se-red);display:block;font-size:.68em;letter-spacing:.2em;margin-top:6px}
  .quote{text-align:center;font-size:10px;line-height:1.75;letter-spacing:.06em;color:var(--ink-soft);
         margin:16px auto 0;max-width:280px}
  .quote u{color:var(--se-red);text-decoration-color:var(--se-red);text-underline-offset:3px}
  .thai{text-align:center;font-size:13px;line-height:1.85;color:var(--ink-soft);margin-top:14px}

  .row{display:flex;gap:14px;align-items:flex-start;padding:13px 0;border-bottom:1px solid var(--line)}
  .row:last-of-type{border-bottom:0}
  .row svg{flex:none;width:19px;height:19px;stroke:var(--ink);fill:none;stroke-width:1.5;margin-top:2px}
  .row .k{font-size:9.5px;letter-spacing:.2em;color:var(--grey);margin-bottom:5px}
  .row .v{font-size:15px;font-weight:600;line-height:1.45}
  .row .v small{display:block;font-weight:400;font-size:12.5px;color:var(--ink-soft);margin-top:3px;letter-spacing:0}
  .row .v .hot{color:var(--se-red)}
  .maplink{display:inline-flex;align-items:center;gap:6px;margin-top:10px;font-size:11px;letter-spacing:.1em;
           color:var(--se-red);text-decoration:none;font-weight:700;
           border-bottom:1px solid color-mix(in srgb,var(--se-red) 35%,#fff);padding-bottom:2px}

  .swatches{display:flex;gap:9px;justify-content:center;margin:18px 0 4px}
  .sw{width:42px;height:42px;border-radius:50%;border:1px solid var(--line)}
  .sw span{display:block;margin-top:48px;font-size:8px;letter-spacing:.1em;color:var(--grey);text-align:center;white-space:nowrap}

  .codebox{border:1.5px solid var(--se-red);border-radius:2px;padding:9px 0;text-align:center;
           font-size:19px;font-weight:700;letter-spacing:.16em;color:var(--se-red);margin:4px 0 16px}
  .codelabel{font-size:9px;letter-spacing:.24em;color:var(--grey);text-align:center;margin-bottom:7px}
  .qrwrap{display:flex;flex-direction:column;align-items:center;gap:8px}
  #qr{width:116px;height:116px;display:grid;place-items:center;background:#fff}
  #qr img,#qr canvas{width:116px !important;height:116px !important;display:block}
  .qrcap{font-size:8.5px;letter-spacing:.22em;color:var(--grey)}

  .btn{display:block;width:100%;border:0;border-radius:2px;padding:15px;cursor:pointer;font-family:inherit;
       font-size:12px;font-weight:700;letter-spacing:.18em;background:var(--se-red);color:#fff;transition:transform .12s}
  .btn:active{transform:scale(.985)}
  .btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
  .btn.mini{padding:12px;font-size:11px;letter-spacing:.14em}
  .btnstack{display:flex;flex-direction:column;gap:9px;margin-top:18px}

  .foot{flex:none;padding:10px 26px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line);
        display:flex;align-items:center;justify-content:space-between;gap:10px}
  .foot p{margin:0;font-size:8.5px;letter-spacing:.2em;color:var(--grey);flex:1;text-align:center}
  .foot p u{color:var(--se-red);text-decoration-color:var(--se-red)}
  .sound{border:0;background:none;padding:6px;cursor:pointer;color:var(--grey);line-height:0}
  .sound svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.6}

  @media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important}}
  :focus-visible{outline:2px solid var(--se-red);outline-offset:3px}
</style>
</head>

        <div class="sw" style="background:#111111"><span>BLACK</span></div>
      </div>
      <p class="thai" style="margin-top:28px">${CONFIG.dressTH}<br>
        <span style="font-size:11.5px;color:var(--grey)">แตะสีดำได้ที่เครื่องประดับหรือรายละเอียดเล็กน้อย</span></p>
    </div>`,

    /* 5 */
    `<div class="card">
      <p class="codelabel">INVITATION CODE</p>
      <div class="codebox">${HAS_CODE ? CONFIG.code : "ตัวอย่าง — PREVIEW"}</div>
      <div class="qrwrap"><div id="qr"></div><p class="qrcap">SCAN TO RSVP</p></div>
      <div class="btnstack"><button class="btn" id="rsvpBtn">ตอบรับคำเชิญ</button></div>
      <p style="font-size:10.5px;color:var(--grey);text-align:center;margin:14px 0 0;letter-spacing:.04em">
        กรุณาตอบรับภายในวันที่ ${CONFIG.deadline}</p>
    </div>`
  ];
  panel.innerHTML = views[i];
  if(i===5){
    makeQR();
    document.getElementById("rsvpBtn").onclick = ()=>{ location.href = rsvpLink(); };
  }
}

/* ===== 3. เสียงลูกบิด ===== */
let ac=null, master=null, noise=null, muted=false;
function audio(){
  if(ac) return ac;
  ac = new (window.AudioContext||window.webkitAudioContext)();
  master = ac.createGain(); master.gain.value=.9; master.connect(ac.destination);
  const len = ac.sampleRate*.12;
  noise = ac.createBuffer(1,len,ac.sampleRate);
  const d = noise.getChannelData(0);
  for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*(1-i/len);
  return ac;
}
function clickSound(soft){
  if(muted) return;
  const c=audio(); if(c.state==="suspended") c.resume();
  const t=c.currentTime, v=soft?.5:1;
  const s=c.createBufferSource(); s.buffer=noise;
  const bp=c.createBiquadFilter(); bp.type="bandpass"; bp.frequency.value=2400; bp.Q.value=1.1;
  const g=c.createGain();
  g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.30*v,t+.004);
  g.gain.exponentialRampToValueAtTime(.0001,t+.045);
  s.connect(bp).connect(g).connect(master); s.start(t); s.stop(t+.06);
  const o=c.createOscillator(); o.type="sine";
  o.frequency.setValueAtTime(190,t); o.frequency.exponentialRampToValueAtTime(68,t+.05);
  const g2=c.createGain(); g2.gain.setValueAtTime(.16*v,t); g2.gain.exponentialRampToValueAtTime(.0001,t+.08);
  o.connect(g2).connect(master); o.start(t); o.stop(t+.09);
  if(navigator.vibrate) navigator.vibrate(soft?6:12);
}

/* ===== 4. ลูกบิด ===== */
const dialbox=document.getElementById("dialbox"), knob=document.getElementById("knob"),
      heat=document.getElementById("heatPath"), dotsEl=document.getElementById("dots"),
      panel=document.getElementById("panel"), hint=document.getElementById("hint"),
      mark=document.getElementById("mark");
let angle=MIN, index=0, touched=false;

STOPS.forEach((s,i)=>{
  const b=document.createElement("button");
  b.className="dot"; b.innerHTML=`<i></i><em>${s.label}</em>`;
  b.setAttribute("aria-label","ไปที่ "+s.label);
  b.onclick=()=>goTo(i,true); dotsEl.appendChild(b);
});

function paint(){
  const on = index>0;
  heat.style.strokeDashoffset = 100 - ((angle-MIN)/SWEEP)*100;
  knob.style.transform = `rotate(${angle}deg)`;
  document.documentElement.style.setProperty("--accent",STOPS[index].color);
  mark.classList.toggle("live",on);
  dotsEl.querySelectorAll(".dot").forEach((d,i)=>{
    d.classList.toggle("on",i===index); d.classList.toggle("past",i<index);
  });
  dialbox.setAttribute("aria-valuenow",index);
  dialbox.setAttribute("aria-valuetext",STOPS[index].label);
}
function setIndex(i){ if(i===index) return; index=i; clickSound(false); render(i); }
function goTo(i,animate){
  i=Math.max(0,Math.min(N-1,i)); markTouched();
  const target=MIN+i*STEP;
  if(animate){
    const from=angle, dur=320, t0=performance.now();
    const step=now=>{
      const p=Math.min(1,(now-t0)/dur);
      angle=from+(target-from)*(1-Math.pow(1-p,3));
      setIndex(Math.round((angle-MIN)/STEP)); paint();
      if(p<1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  }else{ angle=target; setIndex(i); paint(); }
}
function markTouched(){ if(touched) return; touched=true; hint.classList.add("gone"); }

let dragging=false, lastRaw=0;
const angleOf=e=>{
  const r=dialbox.getBoundingClientRect();
  return Math.atan2(e.clientX-(r.left+r.width/2), -(e.clientY-(r.top+r.height/2)))*180/Math.PI;
};
dialbox.addEventListener("pointerdown",e=>{
  dragging=true; dialbox.setPointerCapture(e.pointerId);
  lastRaw=angleOf(e); markTouched(); audio();
});
dialbox.addEventListener("pointermove",e=>{
  if(!dragging) return;
  /* คิดจากระยะที่นิ้วขยับ ไม่ใช่ตำแหน่งสัมบูรณ์
     ทำให้หมุนเลยปลายทั้งสองข้างแล้วค้างอยู่ที่ปลาย ไม่วนกลับไปอีกฝั่ง */
  const raw = angleOf(e);
  let d = raw - lastRaw;
  if(d > 180) d -= 360;
  if(d < -180) d += 360;
  lastRaw = raw;
  angle = Math.max(MIN, Math.min(MAX, angle + d));
  setIndex(Math.round((angle-MIN)/STEP)); paint();
});
const release=()=>{ if(dragging){ dragging=false; goTo(index,true); } };
dialbox.addEventListener("pointerup",release);
dialbox.addEventListener("pointercancel",release);
dialbox.addEventListener("keydown",e=>{
  if(["ArrowRight","ArrowUp"].includes(e.key)){ goTo(index+1,true); e.preventDefault(); }
  if(["ArrowLeft","ArrowDown"].includes(e.key)){ goTo(index-1,true); e.preventDefault(); }
});
let wheelLock=0;
dialbox.addEventListener("wheel",e=>{
  e.preventDefault();
  const now=Date.now(); if(now-wheelLock<220) return; wheelLock=now;
  goTo(index+(e.deltaY>0?1:-1),true);
},{passive:false});
let sx=0;
panel.addEventListener("touchstart",e=>sx=e.touches[0].clientX,{passive:true});
panel.addEventListener("touchend",e=>{
  const d=e.changedTouches[0].clientX-sx;
  if(Math.abs(d)>60) goTo(index+(d<0?1:-1),true);
},{passive:true});

/* ===== 5. QR → หน้าแบบฟอร์ม ===== */
function rsvpLink(){
  return HAS_CODE
    ? CONFIG.rsvpURL+"?code="+encodeURIComponent(CONFIG.code)+(GUEST_NAME?"&name="+encodeURIComponent(GUEST_NAME):"")
    : CONFIG.rsvpURL;
}

function makeQR(){
  const box=document.getElementById("qr"); if(!box) return;
  box.innerHTML="";
  const url = rsvpLink();
  if(window.QRCode){
    new QRCode(box,{text:url,width:116,height:116,colorDark:"#111111",colorLight:"#ffffff",correctLevel:QRCode.CorrectLevel.M});
  }else{
    box.innerHTML=`<div style="width:116px;height:116px;border:1px dashed var(--line);display:grid;place-items:center;
      font-size:9px;letter-spacing:.14em;color:var(--grey);text-align:center;padding:10px">QR CODE<br>${CONFIG.code}</div>`;
  }
}

document.getElementById("soundBtn").onclick=function(){
  muted=!muted;
  this.style.color = muted?"var(--line)":"var(--grey)";
  this.setAttribute("aria-label",muted?"เปิดเสียง":"ปิดเสียง");
  document.getElementById("soundIcon").innerHTML = muted
    ? '<path d="M11 5 6 9H3v6h3l5 4V5z"/><path d="m16 9 5 6M21 9l-5 6"/>'
    : '<path d="M11 5 6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/>';
  if(!muted) clickSound(true);
};

render(0); paint();
</script>
