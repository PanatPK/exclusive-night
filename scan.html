<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1">
<title>CHECK-IN SCANNER — THE EX-CLUSIVE NIGHT</title>
<style>
  :root{--se-red:#E2001A;--ok:#0F9D58;--warn:#F5A623;--ink:#111;--grey:#8A8A8E;--line:#2A2A2E;
        --font-ui:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Segoe UI","Noto Sans Thai","Sarabun",Arial,sans-serif}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{margin:0;background:#0A0A0B;color:#fff;font-family:var(--font-ui);
       display:flex;justify-content:center;overflow:hidden}
  .app{width:100%;max-width:480px;height:100dvh;display:flex;flex-direction:column;background:#0A0A0B}

  header{flex:none;padding:14px 18px calc(14px);border-bottom:1px solid var(--line);
         display:flex;align-items:center;gap:12px}
  .logo{background:#fff;border:1px solid #1a1a1a;padding:4px 9px 3px;flex:none}
  .logo b{display:block;font-size:11px;font-weight:800;letter-spacing:-.01em;color:#111;line-height:1.15}
  .logo i{display:block;height:3px;background:var(--se-red);margin-top:2px}
  header h1{margin:0;font-size:10px;letter-spacing:.2em;font-weight:800}
  header h1 span{display:block;font-size:8.5px;letter-spacing:.12em;color:var(--grey);font-weight:400;margin-top:4px}
  .count{margin-left:auto;text-align:right}
  .count b{display:block;font-size:20px;line-height:1}
  .count em{font-style:normal;font-size:8.5px;letter-spacing:.14em;color:var(--grey)}

  .camwrap{position:relative;flex:1;min-height:0;background:#000;overflow:hidden}
  video{width:100%;height:100%;object-fit:cover;display:block}
  .frame{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
  .box{width:63%;aspect-ratio:1;border-radius:16px;box-shadow:0 0 0 3000px rgba(0,0,0,.5);
       border:2px solid rgba(255,255,255,.85);transition:border-color .2s}
  .scanline{position:absolute;left:0;right:0;height:2px;background:var(--se-red);opacity:.85;
            animation:sweep 2.4s ease-in-out infinite}
  @keyframes sweep{0%,100%{top:20%}50%{top:80%}}
  .camnote{position:absolute;left:0;right:0;bottom:14px;text-align:center;font-size:10.5px;
           letter-spacing:.14em;color:rgba(255,255,255,.7)}
  .starter{position:absolute;inset:0;display:grid;place-items:center;background:#0A0A0B;padding:30px;text-align:center}
  .starter p{color:var(--grey);font-size:12.5px;line-height:1.9;margin:0 0 22px}

  .result{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
          gap:8px;padding:30px;text-align:center;animation:pop .25s ease both}
  @keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
  .result.show{display:flex}
  .result.ok{background:rgba(15,157,88,.96)}
  .result.dup{background:rgba(245,166,35,.96);color:#1a1a1a}
  .result.bad{background:rgba(226,0,26,.96)}
  .result .mark{font-size:52px;line-height:1;margin-bottom:6px}
  .result h2{margin:0;font-size:24px;font-weight:700}
  .result .meta{font-size:13px;opacity:.92;line-height:1.8;margin:0}
  .result .tag{font-size:9.5px;letter-spacing:.22em;opacity:.8;margin-bottom:10px}
  .result button{margin-top:20px;border:1.5px solid currentColor;background:transparent;color:inherit;
                 font-family:inherit;font-size:11px;letter-spacing:.16em;font-weight:700;padding:12px 26px;cursor:pointer}

  .bottom{flex:none;border-top:1px solid var(--line);background:#0A0A0B}
  .tools{display:flex;gap:8px;padding:12px 14px}
  .tools input{flex:1;background:#151517;border:1px solid var(--line);color:#fff;font-family:inherit;
               font-size:15px;padding:12px 13px;outline:none;border-radius:2px}
  .tools input:focus{border-color:var(--se-red)}
  .tools button{border:1px solid var(--line);background:#151517;color:#fff;font-family:inherit;
                font-size:10px;letter-spacing:.12em;padding:12px 14px;cursor:pointer;border-radius:2px}
  .btn{display:block;width:100%;border:0;padding:15px;background:var(--se-red);color:#fff;font-family:inherit;
       font-size:11.5px;font-weight:700;letter-spacing:.18em;cursor:pointer;border-radius:2px}
  .list{max-height:34dvh;overflow-y:auto;border-top:1px solid var(--line)}
  .list div{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);font-size:13px}
  .list div b{font-weight:600}
  .list div small{display:block;color:var(--grey);font-size:11px;margin-top:2px}
  .list div .go{margin-left:auto;border:1px solid #fff;background:transparent;color:#fff;font-family:inherit;
                font-size:9.5px;letter-spacing:.12em;padding:8px 12px;cursor:pointer;white-space:nowrap}
  .list div .go.done{border-color:var(--ok);color:var(--ok)}
  .list .none{color:var(--grey);justify-content:center;font-size:12px}
  .footnote{padding:10px 16px calc(12px + env(safe-area-inset-bottom));font-size:9.5px;letter-spacing:.1em;
            color:var(--grey);text-align:center}
</style>
</head>
<body>
<div class="app">

  <header>
    <div class="logo"><b>STIEBEL ELTRON</b><i></i></div>
    <h1>CHECK-IN<span id="counterName">COUNTER 1</span></h1>
    <div class="count"><b id="cIn">0</b><em>CHECKED IN</em></div>
  </header>

  <div class="camwrap" id="camwrap">
    <video id="video" playsinline muted></video>
    <div class="frame"><div class="box"><span class="scanline"></span></div></div>
    <p class="camnote">วาง QR ของแขกให้อยู่ในกรอบ</p>

    <div class="starter" id="starter">
      <div>
        <p>แตะเพื่อเปิดกล้อง<br>สแกน QR บนบัตรเชิญหรือ Entry Pass ของแขก<br>
           <span style="font-size:11px">ถ้าไม่มี QR ใช้ช่องค้นหาชื่อด้านล่างได้</span></p>
        <button class="btn" id="startBtn" style="max-width:240px;margin:0 auto">เปิดกล้อง</button>
      </div>
    </div>

    <div class="result" id="result">
      <span class="mark" id="rMark">✓</span>
      <p class="tag" id="rTag">CHECKED IN</p>
      <h2 id="rName">—</h2>
      <p class="meta" id="rMeta"></p>
      <button id="rNext">สแกนคนถัดไป</button>
    </div>
  </div>

  <div class="bottom">
    <div class="tools">
      <input id="search" type="search" placeholder="ค้นหาชื่อ / บริษัท / รหัสบัตร">
      <button id="refresh">รีเฟรช</button>
    </div>
    <div class="list" id="list"></div>
    <p class="footnote" id="foot">กำลังโหลดรายชื่อ…</p>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.js"></script>
<script src="config.js"></script>
<script>
/* ===== ตั้งค่าให้ตรงกับไฟล์ฟอร์มและแดชบอร์ด ===== */
const DB = (window.EXN && window.EXN.db) || { url:"", path:"rsvps", auth:"" };
const q = p => DB.url.replace(/\/$/,"") + "/" + p + ".json" + (DB.auth ? "?auth="+DB.auth : "");

const qp = new URLSearchParams(location.search);
counterName.textContent = "COUNTER " + (qp.get("counter") || "1");
const COUNTER = qp.get("counter") || "1";

let rows = [], busy = false;

/* ---------- โหลดรายชื่อ ---------- */
async function load(){
  if(DB.url){
    try{
      const r = await fetch(q(DB.path));
      const data = await r.json() || {};
      rows = Object.entries(data).map(([key,v]) => ({key, ...v}));
      foot.textContent = "เชื่อมต่อแล้ว · " + rows.filter(r=>r.attending==="yes").length + " รายชื่อในระบบ";
    }catch(e){ foot.textContent = "เชื่อมต่อฐานข้อมูลไม่ได้ — ตรวจสอบอินเทอร์เน็ต"; }
  }else{
    rows = [];
    try{
      const l = await window.storage.list("rsvp:");
      for(const k of (l?.keys||[])){
        try{ const it = await window.storage.get(k); rows.push({key:k, ...JSON.parse(it.value)}); }catch(e){}
      }
    }catch(e){}
    foot.textContent = "โหมดเดโม — ยังไม่ได้ใส่ Database URL";
  }
  paint();
}
function paint(){
  cIn.textContent = rows.filter(r=>r.checkedIn).length;
  drawList();
}

/* ---------- ค้นหา / เช็คอินด้วยมือ ---------- */
function drawList(){
  const t = search.value.trim().toLowerCase();
  if(!t){ list.innerHTML = ""; return; }
  const hits = rows.filter(r => [r.name,r.company,r.phone,r.code].join(" ").toLowerCase().includes(t)).slice(0,20);
  list.innerHTML = hits.length
    ? hits.map(r=>`<div><div><b>${esc(r.name||"-")}</b>
        <small>${esc(r.company||"")} ${r.code?"· "+esc(r.code):""} · ${r.guests||1} ท่าน</small></div>
        <button class="go ${r.checkedIn?"done":""}" data-k="${r.key}">${r.checkedIn?"เช็คอินแล้ว":"เช็คอิน"}</button></div>`).join("")
    : `<div class="none">ไม่พบรายชื่อที่ตรงกับคำค้น</div>`;
  list.querySelectorAll(".go").forEach(b=> b.onclick = ()=> checkIn(rows.find(r=>r.key===b.dataset.k)));
}
search.oninput = drawList;
refresh.onclick = load;

/* ---------- เช็คอิน ---------- */
async function checkIn(rec){
  if(!rec) return show("bad","✕","ไม่พบข้อมูล","ไม่พบรหัสนี้ในระบบ กรุณาค้นหาด้วยชื่อ");
  if(rec.attending !== "yes")
    return show("dup","!","แจ้งไม่เข้าร่วม", esc(rec.name)+"<br>กรุณาตรวจสอบกับทีมงานก่อน");
  if(rec.checkedIn){
    const t = rec.checkedInAt ? new Date(rec.checkedInAt).toLocaleTimeString("th-TH",{hour:"2-digit",minute:"2-digit"}) : "";
    return show("dup","!","เช็คอินไปแล้ว", esc(rec.name)+(t?"<br>เวลา "+t:""));
  }
  rec.checkedIn = true;
  rec.checkedInAt = new Date().toISOString();
  rec.checkedInBy = "COUNTER "+COUNTER;
  paint();
  const patch = {checkedIn:true, checkedInAt:rec.checkedInAt, checkedInBy:rec.checkedInBy};
  if(DB.url){
    try{ await fetch(q(DB.path+"/"+rec.key), {method:"PATCH",headers:{"Content-Type":"application/json"},
                                              body:JSON.stringify(patch)}); }catch(e){}
  }else{
    try{ await window.storage.set(rec.key, JSON.stringify({...rec, key:undefined})); }catch(e){}
  }
  show("ok","✓","ยินดีต้อนรับ",
       esc(rec.name)+"<br>"+(rec.guests||1)+" ท่าน"+(rec.companion?" · "+esc(rec.companion):"")+
       (rec.diet?'<br><span style="font-size:11px">แพ้อาหาร: '+esc(rec.diet)+'</span>':""));
}

/* ---------- แสดงผล ---------- */
function show(type,mark,tag,meta){
  busy = true;
  result.className = "result show "+type;
  rMark.textContent = mark; rTag.textContent = tag;
  rName.innerHTML = meta.split("<br>")[0];
  rMeta.innerHTML = meta.split("<br>").slice(1).join("<br>");
  beep(type);
  clearTimeout(show._t);
  show._t = setTimeout(hide, type==="ok" ? 2600 : 4000);
}
function hide(){ result.className = "result"; busy = false; }
rNext.onclick = hide;

function beep(type){
  try{
    const c = new (window.AudioContext||window.webkitAudioContext)();
    const o = c.createOscillator(), g = c.createGain(), t = c.currentTime;
    o.type = "sine";
    const f = type==="ok" ? [880,1320] : type==="dup" ? [520,520] : [300,200];
    o.frequency.setValueAtTime(f[0],t); o.frequency.exponentialRampToValueAtTime(f[1],t+.12);
    g.gain.setValueAtTime(.22,t); g.gain.exponentialRampToValueAtTime(.0001,t+.28);
    o.connect(g).connect(c.destination); o.start(t); o.stop(t+.3);
  }catch(e){}
  if(navigator.vibrate) navigator.vibrate(type==="ok" ? 40 : [30,60,30]);
}
const esc = s => String(s??"").replace(/[<>&"]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]));

/* ---------- กล้อง + อ่าน QR ---------- */
const canvas = document.createElement("canvas"), ctx = canvas.getContext("2d", {willReadFrequently:true});
let detector = null, lastText = "", lastAt = 0;

startBtn.onclick = async ()=>{
  try{
    const stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}}});
    video.srcObject = stream; await video.play();
    starter.style.display = "none";
    if("BarcodeDetector" in window){
      try{ detector = new BarcodeDetector({formats:["qr_code"]}); }catch(e){ detector = null; }
    }
    requestAnimationFrame(loop);
  }catch(e){
    starter.innerHTML = `<div><p>เปิดกล้องไม่ได้<br>
      ต้องเปิดหน้านี้ผ่าน https และอนุญาตให้ใช้กล้อง<br>
      <span style="font-size:11px">ระหว่างนี้ใช้ช่องค้นหาชื่อด้านล่างเช็คอินได้ตามปกติ</span></p></div>`;
  }
};

async function loop(){
  if(video.readyState === video.HAVE_ENOUGH_DATA && !busy){
    let text = null;
    if(detector){
      try{ const c = await detector.detect(video); if(c.length) text = c[0].rawValue; }catch(e){}
    }else if(window.jsQR){
      const w = 420, h = Math.round(video.videoHeight / video.videoWidth * w);
      canvas.width = w; canvas.height = h;
      ctx.drawImage(video,0,0,w,h);
      const img = ctx.getImageData(0,0,w,h);
      const r = jsQR(img.data, w, h, {inversionAttempts:"dontInvert"});
      if(r) text = r.data;
    }
    if(text) handle(text);
  }
  requestAnimationFrame(loop);
}

function handle(text){
  const now = Date.now();
  if(text === lastText && now - lastAt < 3000) return;
  lastText = text; lastAt = now;

  /* รองรับทั้ง "EXN|CODE|ชื่อ|จำนวน", URL ที่มี ?code= และรหัสเปล่า */
  let code = text.trim();
  if(code.startsWith("EXN|")) code = code.split("|")[1];
  else if(/^https?:/i.test(code)){
    try{ code = new URL(code).searchParams.get("code") || code; }catch(e){}
  }
  const rec = rows.find(r => (r.code||"").toUpperCase() === code.toUpperCase());
  if(!rec) return show("bad","✕","ไม่พบข้อมูล","รหัส "+esc(code)+"<br>ยังไม่ได้ลงทะเบียนหรือรหัสไม่ถูกต้อง");
  checkIn(rec);
}

load();
setInterval(()=>{ if(!busy) load(); }, 30000);
</script>
</body>
</html>
